name: ai-bi-assistant

x-superset-environment: &superset-environment
  SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Set SUPERSET_SECRET_KEY in .env}
  SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:?Set SUPERSET_ADMIN_USERNAME in .env}
  SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Set SUPERSET_ADMIN_PASSWORD in .env}
  SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:?Set SUPERSET_ADMIN_EMAIL in .env}
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  SUPERSET_DB_NAME: ${SUPERSET_DB_NAME:-superset}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  SUPERSET_CONFIG_PATH: /app/superset_config.py
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:43117}
  MCP_DEV_USERNAME: ${MCP_DEV_USERNAME:-admin}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${APP_DB_NAME:-ai_bi}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ai_bi_network

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - ai_bi_network

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-AI BI Assistant API}
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:43117}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:43117,http://127.0.0.1:43117}
      SUPERSET_URL: ${SUPERSET_URL:-http://superset:8088}
      SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL:-http://localhost:58088}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:?Set SUPERSET_ADMIN_USERNAME in .env}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Set SUPERSET_ADMIN_PASSWORD in .env}
      SUPERSET_MCP_INTERNAL_URL: ${SUPERSET_MCP_INTERNAL_URL:-http://superset-mcp:5008/mcp}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      AI_ALLOW_SUPERSET_WRITE: ${AI_ALLOW_SUPERSET_WRITE:-false}
      SUPERSET_TAXI_DATASET_ID: ${SUPERSET_TAXI_DATASET_ID:-1}
      DEFAULT_QUERY_LIMIT: ${DEFAULT_QUERY_LIMIT:-100}
      MAX_QUERY_LIMIT: ${MAX_QUERY_LIMIT:-500}
      AI_QUERY_TIMEOUT_SECONDS: ${AI_QUERY_TIMEOUT_SECONDS:-10}
      AI_ANSWER_MAX_ROWS: ${AI_ANSWER_MAX_ROWS:-20}
    ports:
      - "127.0.0.1:48123:8000"
    volumes:
      - ./backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ai_bi_network

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:48123}
      NEXT_PUBLIC_SUPERSET_URL: ${NEXT_PUBLIC_SUPERSET_URL:-http://localhost:58088}
    ports:
      - "127.0.0.1:43117:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: ["sh", "-c", "npm install && npm run dev"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ai_bi_network

  superset-init:
    build:
      context: ./superset
    restart: "no"
    environment:
      <<: *superset-environment
    volumes:
      - superset_home:/app/superset_home
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/bin/sh", "/app/init-superset.sh"]
    networks:
      - ai_bi_network

  superset:
    build:
      context: ./superset
    restart: unless-stopped
    environment:
      <<: *superset-environment
    volumes:
      - superset_home:/app/superset_home
    ports:
      - "127.0.0.1:58088:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - ai_bi_network

  # Keep the MCP server separate from the Superset web process while sharing
  # exactly the same image, configuration, metadata database, and home volume.
  # This port is bound only to localhost for local-development testing.
  superset-mcp:
    build:
      context: ./superset
    restart: unless-stopped
    environment:
      <<: *superset-environment
    volumes:
      - superset_home:/app/superset_home
    ports:
      - "127.0.0.1:55008:5008"
    command: ["superset", "mcp", "run", "--host", "0.0.0.0", "--port", "5008"]
    depends_on:
      superset-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 5008), 3).close()"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - ai_bi_network

  data-loader:
    profiles: ["tools"]
    build:
      context: ./database
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      APP_DB_NAME: ${APP_DB_NAME:-ai_bi}
      DATA_DIR: /data
      DEMO_MAX_ROWS_PER_SOURCE: ${DEMO_MAX_ROWS_PER_SOURCE:-10000}
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai_bi_network

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  frontend_next:
  superset_home:

networks:
  ai_bi_network:
    driver: bridge
