name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      backend_tag: ${{ steps.images.outputs.backend_tag }}
      frontend_tag: ${{ steps.images.outputs.frontend_tag }}
      superset_tag: ${{ steps.images.outputs.superset_tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select images from service contents
        id: images
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://18.143.137.242:55200' }}
          NEXT_PUBLIC_SUPERSET_URL: ${{ vars.NEXT_PUBLIC_SUPERSET_URL || 'http://18.143.137.242:55200/superset' }}
        run: |
          for service in backend frontend superset; do
            source="$(git rev-parse "HEAD:$service")"
            if [ "$service" = frontend ]; then
              source="$(printf '%s\n' "$source" "$NEXT_PUBLIC_API_URL" "$NEXT_PUBLIC_SUPERSET_URL" | sha256sum | cut -d ' ' -f 1)"
            fi
            tag="source-$source"
            image="ghcr.io/dekii2275/llm-superset-$service:$tag"
            echo "${service}_tag=$tag" >> "$GITHUB_OUTPUT"
            echo "- $service: \`$image\`" >> "$GITHUB_STEP_SUMMARY"
            if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "Reusing $image"
              echo "${service}_build=false" >> "$GITHUB_OUTPUT"
            else
              echo "Building $image"
              echo "${service}_build=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Build and push backend image
        if: steps.images.outputs.backend_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          cache-from: |
            type=registry,ref=ghcr.io/dekii2275/llm-superset-backend:buildcache
            type=registry,ref=ghcr.io/dekii2275/llm-superset-backend:latest
          cache-to: type=registry,ref=ghcr.io/dekii2275/llm-superset-backend:buildcache,mode=max
          tags: |
            ghcr.io/dekii2275/llm-superset-backend:${{ steps.images.outputs.backend_tag }}
            ghcr.io/dekii2275/llm-superset-backend:${{ github.event.workflow_run.head_sha }}
            ghcr.io/dekii2275/llm-superset-backend:latest

      - name: Build and push frontend image
        if: steps.images.outputs.frontend_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          cache-from: |
            type=registry,ref=ghcr.io/dekii2275/llm-superset-frontend:buildcache
            type=registry,ref=ghcr.io/dekii2275/llm-superset-frontend:latest
          cache-to: type=registry,ref=ghcr.io/dekii2275/llm-superset-frontend:buildcache,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://18.143.137.242:55200' }}
            NEXT_PUBLIC_SUPERSET_URL=${{ vars.NEXT_PUBLIC_SUPERSET_URL || 'http://18.143.137.242:55200/superset' }}
          tags: |
            ghcr.io/dekii2275/llm-superset-frontend:${{ steps.images.outputs.frontend_tag }}
            ghcr.io/dekii2275/llm-superset-frontend:${{ github.event.workflow_run.head_sha }}
            ghcr.io/dekii2275/llm-superset-frontend:latest

      - name: Build and push Superset image
        if: steps.images.outputs.superset_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./superset
          push: true
          cache-from: |
            type=registry,ref=ghcr.io/dekii2275/llm-superset-superset:buildcache
            type=registry,ref=ghcr.io/dekii2275/llm-superset-superset:latest
          cache-to: type=registry,ref=ghcr.io/dekii2275/llm-superset-superset:buildcache,mode=max
          tags: |
            ghcr.io/dekii2275/llm-superset-superset:${{ steps.images.outputs.superset_tag }}
            ghcr.io/dekii2275/llm-superset-superset:${{ github.event.workflow_run.head_sha }}
            ghcr.io/dekii2275/llm-superset-superset:latest

      - name: Tag reused images for this release
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          BACKEND_TAG: ${{ steps.images.outputs.backend_tag }}
          FRONTEND_TAG: ${{ steps.images.outputs.frontend_tag }}
          SUPERSET_TAG: ${{ steps.images.outputs.superset_tag }}
          BUILD_BACKEND: ${{ steps.images.outputs.backend_build }}
          BUILD_FRONTEND: ${{ steps.images.outputs.frontend_build }}
          BUILD_SUPERSET: ${{ steps.images.outputs.superset_build }}
        run: |
          for service in backend frontend superset; do
            name="${service^^}"
            build_var="BUILD_$name"
            tag_var="${name}_TAG"
            if [ "${!build_var}" = false ]; then
              image="ghcr.io/dekii2275/llm-superset-$service"
              docker buildx imagetools create --tag "$image:$RELEASE_SHA" \
                --tag "$image:latest" "$image:${!tag_var}"
            fi
          done

      - name: Smoke-test published images before deployment
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          BACKEND_IMAGE_TAG: ${{ steps.images.outputs.backend_tag }}
          FRONTEND_IMAGE_TAG: ${{ steps.images.outputs.frontend_tag }}
          SUPERSET_IMAGE_TAG: ${{ steps.images.outputs.superset_tag }}
        run: |
          cat > .env.smoke <<'EOF'
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci_smoke_password
          APP_DB_NAME=ai_bi
          SUPERSET_DB_NAME=superset
          SUPERSET_SECRET_KEY=ci-smoke-secret-key-with-more-than-32-characters
          SUPERSET_ADMIN_USERNAME=ciadmin
          SUPERSET_ADMIN_PASSWORD=ci_smoke_admin_password
          SUPERSET_ADMIN_EMAIL=ci@example.com
          SUPERSET_APP_ROOT=/superset
          ENABLE_PROXY_FIX=true
          FRONTEND_URL=http://localhost:55200
          FRONTEND_ORIGINS=http://localhost:55200
          SUPERSET_PUBLIC_URL=http://localhost:55200/superset
          NEXT_PUBLIC_API_URL=http://localhost:55200
          NEXT_PUBLIC_SUPERSET_URL=http://localhost:55200/superset
          MCP_DEV_USERNAME=ciadmin
          GEMINI_API_KEY=
          EOF
          compose=(docker compose --env-file .env.smoke -f docker-compose.yml -f docker-compose.prod.yml)
          timeout --kill-after=15s 5m "${compose[@]}" pull backend frontend superset public-gateway

          if ! timeout --kill-after=15s 8m "${compose[@]}" up -d --no-build --wait --wait-timeout 420 \
            backend frontend superset superset-mcp public-gateway; then
            echo "Candidate images failed Compose health checks." >&2
            "${compose[@]}" ps
            "${compose[@]}" logs --tail=100 backend frontend superset-init superset superset-mcp public-gateway
            exit 1
          fi

          check_http_200() {
            url="$1"
            status="$(curl --connect-timeout 5 --max-time 20 --silent --show-error \
              --output /dev/null --write-out '%{http_code}' "$url" || true)"
            if [ "$status" != "200" ]; then
              echo "Expected HTTP 200 from $url, got ${status:-no response}." >&2
              "${compose[@]}" ps
              "${compose[@]}" logs --tail=100 backend frontend superset-init superset superset-mcp public-gateway
              return 1
            fi
          }

          check_http_200 http://127.0.0.1:55200/health
          check_http_200 http://127.0.0.1:55200/health/db
          check_http_200 http://127.0.0.1:55200/health/superset
          check_http_200 http://127.0.0.1:55200/
          check_http_200 http://127.0.0.1:55200/superset/health

      - name: Remove candidate smoke-test stack
        if: always()
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -f .env.smoke ]; then
            docker compose --env-file .env.smoke \
              -f docker-compose.yml -f docker-compose.prod.yml \
              down --volumes --remove-orphans || true
          fi

  deploy:
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Package Compose configuration
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          git archive --format=tar.gz --output=compose.tar.gz "$DEPLOY_SHA"
          docker-compose.yml docker-compose.prod.yml database deploy

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<'EOF'
          Host *
            ConnectTimeout 15
            ServerAliveInterval 30
            ServerAliveCountMax 6
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Copy Compose configuration to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          scp -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes compose.tar.gz
          "$DEPLOY_USER@$DEPLOY_HOST:/tmp/ai-bi-compose-$DEPLOY_SHA.tar.gz"

      - name: Deploy with Docker Compose
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_IMAGE_TAG: ${{ needs.publish.outputs.backend_tag }}
          FRONTEND_IMAGE_TAG: ${{ needs.publish.outputs.frontend_tag }}
          SUPERSET_IMAGE_TAG: ${{ needs.publish.outputs.superset_tag }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- $DEPLOY_SHA $BACKEND_IMAGE_TAG $FRONTEND_IMAGE_TAG $SUPERSET_IMAGE_TAG" <<'REMOTE'
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          sha="$1"
          app_root="$HOME/ai-bi-assistant"
          test -f "$app_root/.env.prod" || { echo "Missing $app_root/.env.prod" >&2; exit 1; }
          tar -xzf "/tmp/ai-bi-compose-$sha.tar.gz" -C "$app_root"
          cd "$app_root"
          export IMAGE_TAG="$sha"
          export BACKEND_IMAGE_TAG="$2" FRONTEND_IMAGE_TAG="$3" SUPERSET_IMAGE_TAG="$4"
          compose=(docker compose --env-file "$app_root/.env.prod" \
            -f docker-compose.yml -f docker-compose.prod.yml)
          for attempt in 1 2 3; do
            if timeout --kill-after=15s 5m "${compose[@]}" pull backend frontend superset public-gateway; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Image pull failed after 3 attempts." >&2
              exit 1
            fi
            delay=$((attempt * 10))
            echo "Image pull attempt $attempt failed; retrying in ${delay}s." >&2
            sleep "$delay"
          done
          if ! timeout --kill-after=15s 8m "${compose[@]}" up -d --no-build --wait --wait-timeout 420 \
            backend frontend superset superset-mcp; then
            echo "Deployment failed: Compose did not report all services healthy." >&2
            docker compose --env-file "$app_root/.env.prod" \
              -f docker-compose.yml -f docker-compose.prod.yml ps
            docker compose --env-file "$app_root/.env.prod" \
              -f docker-compose.yml -f docker-compose.prod.yml \
              logs --tail=100 backend frontend superset-init superset superset-mcp public-gateway
            exit 1
          fi
          # Refresh Nginx's upstream DNS after changed application containers start.
          if ! timeout --kill-after=15s 2m "${compose[@]}" up -d --no-build --no-deps \
            --force-recreate --wait --wait-timeout 90 public-gateway; then
            "${compose[@]}" logs --tail=100 public-gateway
            exit 1
          fi
          for endpoint in /health /health/db /health/superset / /superset/health; do
            status="$(curl --connect-timeout 5 --max-time 20 --silent --show-error \
              --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:55200$endpoint" || true)"
            echo "$endpoint HTTP $status"
            if [ "$status" != 200 ]; then
              "${compose[@]}" logs --tail=100 backend frontend superset-init superset superset-mcp public-gateway
              exit 1
            fi
          done
          printf 'BACKEND_IMAGE_TAG=%s\nFRONTEND_IMAGE_TAG=%s\nSUPERSET_IMAGE_TAG=%s\n' \
            "$BACKEND_IMAGE_TAG" "$FRONTEND_IMAGE_TAG" "$SUPERSET_IMAGE_TAG" > "$app_root/.images.prod"
          docker compose --env-file "$app_root/.env.prod" \
            -f docker-compose.yml -f docker-compose.prod.yml ps
          REMOTE
